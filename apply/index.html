<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Form - KREWfit</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <div class="container">
        <div class="banner">
            <h1>Application Form</h1>
        </div>
        <div class="header">
            <img src="../images/KREW.png" alt="KREWfit Logo" class="logo">
            <nav>
                <ul>
                    <li><a href="../home/index.html">Home</a></li>
                    <li><a href="./index.html">Application</a></li>
                    <li><a href="../plans/index.html">Plans</a></li>
                </ul>
            </nav>
        </div>
        <form name="application" method="POST" data-netlify="true">
            <p style="text-align: center; margin-bottom: 30px; color: #555;">Let's get to know you! Fill out this application to get started on your fitness journey.</p>
            <p>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </p>
            
            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </p>
            
            <p>
                <label for="phone">Phone Number:</label>
                <input type="text" id="phone" name="phone" required>
            </p>
            
            <p>
                <label for="age">Age:</label>
                <input type="number" id="age" name="age" required>
            </p>
            
            <p>
                <label for="gender">Gender:</label>
                <select id="gender" name="gender" required>
                    <option value="">-- Select an option --</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </p>
            
            <p>
                <label for="goals">Fitness Goals:</label>
                <input type="text" id="goals" name="goals" placeholder="e.g., Build muscle, lose weight, increase endurance">
            </p>
            
            <p>
                <label for="experience">Fitness Experience:</label>
                <input type="text" id="experience" name="experience" placeholder="e.g., Beginner, Intermediate, Advanced">
            </p>
            
            <p>
                <label for="questions">Any Specific Questions or Concerns:</label>
                <textarea id="questions" name="questions" style="height: 100px;"></textarea>
            </p>

            <p>
                <label for="currentRoutine">Current Fitness Routine:</label>
                <textarea id="currentRoutine" name="currentRoutine" style="height: 100px;"></textarea>
            </p>

            <p>
                <label for="expectations">Expectations from Coaching:</label>
                <textarea id="expectations" name="expectations" style="height: 100px;"></textarea>
            </p>

            <p>
                <label for="injuries">Injuries or Limitations:</label>
                <textarea id="injuries" name="injuries" style="height: 100px;"></textarea>
            </p>

            <p>
                <label>Exercise Day Preference:</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="days" value="Monday"> Monday</label>
                    <label><input type="checkbox" name="days" value="Tuesday"> Tuesday</label>
                    <label><input type="checkbox" name="days" value="Wednesday"> Wednesday</label>
                    <label><input type="checkbox" name="days" value="Thursday"> Thursday</label>
                    <label><input type="checkbox" name="days" value="Friday"> Friday</label>
                    <label><input type="checkbox" name="days" value="Saturday"> Saturday</label>
                    <label><input type="checkbox" name="days" value="Sunday"> Sunday</label>
                </div>
            </p>

            <p>
                <label for="startDate">When do you want to start?</label>
                <input type="date" id="startDate" name="startDate" required>
            </p>

            <p>
                <label for="payment">Method of Payment:</label>
                <div class="radio-group">
                    <label><input type="radio" name="paymentMethod" value="PayPal" required> PayPal (eyhong88@gmail.com)</label>
                    <label><input type="radio" name="paymentMethod" value="Venmo"> Venmo (@eyhong88)</label>
                    <label><input type="radio" name="paymentMethod" value="Other"> Other: <input type="text" name="otherPaymentMethod" style="width: 200px;"></label>
                </div>
            </p>

            <p style="text-align: center;">
                <button type="submit">Submit Application</button>
            </p>
        </form>

        <div class="footer">
            <p>&copy; 2024 KREWfit Coaching. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
